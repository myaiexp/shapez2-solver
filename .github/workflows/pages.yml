name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Zero-dependency suite — no install step. Mirrors .githooks/pre-commit.
      - name: Run test suite
        run: |
          # Tests are grouped into tests/{shape,solver,blueprint,shared}/ — discover recursively.
          # Floor is a canary for an empty/missing tests/ tree (keep in lockstep with .githooks/pre-commit).
          mapfile -t TESTS < <(find tests -name '*.test.js' | sort)
          if [ "${#TESTS[@]}" -lt 30 ]; then
            echo "expected >=30 test files, found ${#TESTS[@]}"
            exit 1
          fi
          for t in "${TESTS[@]}"; do
            echo "::group::$t"
            node "$t"
            echo "::endgroup::"
          done
          node tests/shared/smoke.js
          node tests/shared/solve.mjs 'CuCu----' --start CuCuCuCu --ops Cutter --json
          node tests/shared/solve.mjs --explore 2

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Assemble only the static app into _site, then stamp the cache-buster.
      # __COMMIT__ -> short SHA so ?v=<sha> assets bust on every change.
      # The excludes are a denylist of dev-only files and dirs.
      - name: Assemble site
        env:
          SHA: ${{ github.sha }}
        run: |
          mkdir _site
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.githooks/' \
            --exclude='.claude/' \
            --exclude='.gitignore' \
            --exclude='README.md' \
            --exclude='CLAUDE.md' \
            --exclude='AGENTS.md' \
            --exclude='deploy.sh' \
            --exclude='package.json' \
            --exclude='docs/' \
            --exclude='tests/' \
            --exclude='_site/' \
            ./ _site/
          # upload-pages-artifact tars with --dereference, which exits non-zero
          # on a dangling symlink ("File removed before we read it"). rsync -a
          # copies symlinks verbatim, so any link whose target is excluded above
          # lands here broken. Drop them rather than fail the deploy.
          find _site -xtype l -print -delete
          sed -i "s/__COMMIT__/${SHA::7}/g" _site/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
