name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      # Zero-dependency suite — no install step. tests/run-suite.sh is the one
      # gate definition, shared with .githooks/pre-commit; it needs Node >= 22.8
      # for the coverage threshold flags (22 resolves to the latest 22.x).
      - name: Run test suite
        run: bash tests/run-suite.sh

  deploy:
    needs: test
    runs-on: ubuntu-latest
    # Job-level permissions replace the workflow block, so contents: read is
    # restated for checkout; Pages publish scopes stay off the test job.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Assemble only the static app into _site, then stamp the cache-buster.
      # __COMMIT__ -> short SHA so ?v=<sha> assets bust on every change.
      # The excludes are a denylist of dev-only files and dirs.
      - name: Assemble site
        env:
          SHA: ${{ github.sha }}
        run: |
          mkdir _site
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.githooks/' \
            --exclude='.claude/' \
            --exclude='.gitignore' \
            --exclude='README.md' \
            --exclude='CLAUDE.md' \
            --exclude='AGENTS.md' \
            --exclude='deploy.sh' \
            --exclude='package.json' \
            --exclude='docs/' \
            --exclude='tests/' \
            --exclude='_site/' \
            ./ _site/
          # upload-pages-artifact tars with --dereference, which exits non-zero
          # on a dangling symlink ("File removed before we read it"). rsync -a
          # copies symlinks verbatim, so any link whose target is excluded above
          # lands here broken. Drop them rather than fail the deploy.
          find _site -xtype l -print -delete
          sed -i "s/__COMMIT__/${SHA::7}/g" _site/index.html

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
