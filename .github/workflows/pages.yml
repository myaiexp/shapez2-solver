name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      # Zero-dependency suite — no install step. tests/run-suite.sh is the one
      # gate definition, shared with .githooks/pre-commit; it needs Node >= 22.8
      # for the coverage threshold flags (22 resolves to the latest 22.x).
      - name: Run test suite
        run: bash tests/run-suite.sh

  deploy:
    needs: test
    runs-on: ubuntu-latest
    # Job-level permissions replace the workflow block, so contents: read is
    # restated for checkout; Pages publish scopes stay off the test job.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      # _site holds what index.html reaches and nothing else, with __COMMIT__
      # stamped to the short SHA so ?v=<sha> assets bust on every change. The
      # script throws on a reference to a missing file.
      - name: Assemble site
        env:
          SHA: ${{ github.sha }}
        run: node .github/assemble-site.mjs _site "${SHA::7}"

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
